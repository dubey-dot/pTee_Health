[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # Cosmetic-only: pydantic 2.13's alias_generator internals emit this on
    # every CamelModel field; verified the camelCase aliasing itself works
    # correctly (assertions on e.g. `clinicalSummary`/`patientId` pass).
    ignore:.*has no effect.*:UserWarning
    # Cosmetic-only: pytest's collector flags the TestRecommendationBatch
    # Pydantic model (services/engines/base.py) as a possible test class
    # purely because its name starts with "Test" — it's a schema, not a test.
    ignore:cannot collect test class 'TestRecommendationBatch'.*:pytest.PytestCollectionWarning
